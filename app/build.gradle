plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fariz.rotiflow'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fariz.rotiflow'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
